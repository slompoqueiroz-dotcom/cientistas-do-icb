<body>
<div id="rot"><div class="ic">&#128241;</div><b>Gire o celular</b><div>O jogo fica melhor na horizontal.</div><button onclick="document.body.classList.add('ok')">Jogar assim mesmo</button></div>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,TAU=Math.PI*2;
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
let t=0;
// ---------- áudio ----------
let AC=null;
function snd(f,d=.12,type='sine',vol=.12,slide=0,delay=0){
 if(!AC)return;const s=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),s+d);
 g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02);
}

// ---------- utilidades ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>1-Math.pow(1-clamp(k),3);
function rnd(a,b){return a+Math.random()*(b-a)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU)}
function ell(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,TAU)}
function txt(s,x,y,size=16,color='#fff',align='left',weight='normal'){
 ctx.font=`${weight} ${size}px ${FONT}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function wrap(s,x,y,maxW,lh,size,color='#fff',align='left',weight='normal'){
 ctx.font=`${weight} ${size}px ${FONT}`;const words=s.split(' ');let line='';
 for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){txt(line,x,y,size,color,align,weight);y+=lh;line=w}else line=test}
 if(line){txt(line,x,y,size,color,align,weight);y+=lh}return y}
function hit(b,p){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}
function button(label,x,y,w,h,fn,color='#2fb37a'){
 const b={x,y,w,h,fn};buttons.push(b);const hov=hit(b,mouse);
 ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
 rr(x,y-(hov?2:0),w,h,h/2);ctx.fillStyle=hov?'#45d394':color;ctx.fill();ctx.restore();
 txt(label,x+w/2,y+h/2+7-(hov?2:0),20,'#fff','center','bold')}
function heart(x,y,s,color){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;ctx.beginPath();
 ctx.moveTo(0,4);ctx.bezierCurveTo(-10,-4,-6,-12,0,-7);ctx.bezierCurveTo(6,-12,10,-4,0,4);ctx.fill();ctx.restore()}
function fmt(n){return n.toFixed(1).replace('.',',')}
function sgn(n){return(n>=0?'+':'−')+fmt(Math.abs(n))}
function thumbsUp(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='#f4b6c2';ctx.strokeStyle='#b86f7e';ctx.lineWidth=2.5;
 rr(-12,-36,11,28,5);ctx.fill();ctx.stroke();
 rr(-15,-12,32,28,9);ctx.fill();ctx.stroke();
 for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(3,-4+i*7);ctx.lineTo(17,-4+i*7);ctx.stroke()}
 ctx.restore();
}
// ---------- laboratório (fundo) ----------
const BENCH=500;
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const EMITTERS=[
 {cx:70,bottom:BENCH-6,spawnW:26,surface:BENCH-50,neckY:BENCH-72,neckHalf:9,top:BENCH-110,color:'#4fd1c5',rate:2.2},
 {cx:180,bottom:BENCH-74,spawnW:18,surface:BENCH-100,neckY:BENCH-112,neckHalf:7,top:BENCH-170,color:'#ff6b8b',rate:6},
 {cx:735,bottom:BENCH-6,spawnW:26,surface:BENCH-44,neckY:-1e9,neckHalf:30,top:BENCH-82,color:'#7aa2ff',rate:1.6},
 {cx:805,bottom:BENCH-8,spawnW:6,surface:BENCH-86,neckY:-1e9,neckHalf:9,top:BENCH-142,color:'#ffd166',rate:1.4},
 {cx:878,bottom:BENCH-6,spawnW:24,surface:BENCH-42,neckY:BENCH-66,neckHalf:8,top:BENCH-100,color:'#9b7bff',rate:2.4}];
EMITTERS.forEach(e=>e.acc=Math.random());
let bubbles=[],pops=[];
function updateLab(dt){
 for(const e of EMITTERS){e.acc+=dt*e.rate;while(e.acc>=1){e.acc-=1;
  bubbles.push({e,x:e.cx+rnd(-e.spawnW,e.spawnW),y:e.bottom,r:rnd(1.5,3.5),vy:rnd(28,55),ph:rnd(0,TAU),out:false,life:rnd(1.6,3)})}}
 for(const b of bubbles){const e=b.e;b.y-=b.vy*dt;b.x+=Math.sin(t*3+b.ph)*dt*(b.out?18:10);
  if(!b.out){if(b.y<e.neckY)b.x=lerp(b.x,e.cx,clamp(dt*6));b.x=clamp(b.x,e.cx-e.neckHalf+3,e.cx+e.neckHalf-3);
   if(b.y<e.top){b.out=true;b.vy*=.55}}
  else{b.r=Math.min(9,b.r+dt*2.5);b.life-=dt;if(b.life<=0)pops.push({x:b.x,y:b.y,r:b.r,c:e.color,k:0})}}
 bubbles=bubbles.filter(b=>!b.out||b.life>0);
 for(const p of pops)p.k+=dt*3;pops=pops.filter(p=>p.k<1);
}
function flaskPath(x,base,w,h){const nw=w*.24;ctx.beginPath();ctx.moveTo(x-nw/2,base-h);ctx.lineTo(x-nw/2,base-h*.6);ctx.lineTo(x-w/2,base-4);
 ctx.quadraticCurveTo(x-w/2,base,x-w/2+6,base);ctx.lineTo(x+w/2-6,base);ctx.quadraticCurveTo(x+w/2,base,x+w/2,base-4);ctx.lineTo(x+nw/2,base-h*.6);ctx.lineTo(x+nw/2,base-h);}
function liquid(pathFn,surfaceY,bottomY,color){ctx.save();pathFn();ctx.closePath();ctx.clip();
 ctx.fillStyle=hexA(color,.75);ctx.beginPath();ctx.moveTo(0,bottomY);ctx.lineTo(0,surfaceY);
 for(let x=0;x<=W;x+=8)ctx.lineTo(x,surfaceY+Math.sin(x*.15+t*4)*1.2);ctx.lineTo(W,bottomY);ctx.fill();ctx.restore()}
function glass(pathFn,close=false){pathFn();if(close)ctx.closePath();ctx.fillStyle='rgba(200,230,255,.08)';ctx.fill();ctx.strokeStyle='rgba(225,240,255,.75)';ctx.lineWidth=2.2;ctx.stroke()}
function drawErlen(x,w,h,color,fill){const f=()=>flaskPath(x,BENCH,w,h);liquid(f,BENCH-h*fill,BENCH,color);glass(f);
 ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-w*.3,BENCH-12);ctx.lineTo(x-w*.12,BENCH-h*.5);ctx.stroke()}
function drawBeaker(x,w,h,color,fill){const f=()=>{ctx.beginPath();ctx.moveTo(x-w/2-5,BENCH-h);ctx.lineTo(x-w/2,BENCH-h+5);ctx.lineTo(x-w/2,BENCH);ctx.lineTo(x+w/2,BENCH);ctx.lineTo(x+w/2,BENCH-h)};
 liquid(f,BENCH-h*fill,BENCH,color);glass(f);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;
 for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(x-w/2+4,BENCH-i*h/5);ctx.lineTo(x-w/2+(i%2?14:9),BENCH-i*h/5);ctx.stroke()}}
function drawCylinder(x,w,h,color,fill){const f=()=>{ctx.beginPath();ctx.moveTo(x-w/2,BENCH-h);ctx.lineTo(x-w/2,BENCH-6);ctx.lineTo(x+w/2,BENCH-6);ctx.lineTo(x+w/2,BENCH-h)};
 liquid(f,BENCH-6-(h-6)*fill,BENCH-6,color);glass(f);ctx.fillStyle='rgba(225,240,255,.6)';rr(x-w/2-8,BENCH-6,w+16,6,2);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;for(let y=BENCH-20;y>BENCH-h+8;y-=12){ctx.beginPath();ctx.moveTo(x+w/2-2,y);ctx.lineTo(x+w/2-8,y);ctx.stroke()}}
function drawBoiling(x){
 // suporte
 ctx.fillStyle='#55606b';ctx.fillRect(x-60,BENCH-6,70,6);ctx.fillRect(x-52,BENCH-200,5,196);
 ctx.fillRect(x-50,BENCH-150,40,4);ctx.strokeStyle='#55606b';ctx.lineWidth=3;circle(x,BENCH-148,9);ctx.stroke();
 // bico de Bunsen
 ctx.fillStyle='#6b7785';ctx.fillRect(x-14,BENCH-8,28,8);ctx.fillRect(x-5,BENCH-44,10,36);
 const fl=1+Math.sin(t*22)*.08+Math.sin(t*13)*.06;
 ctx.fillStyle='rgba(90,150,255,.85)';ctx.beginPath();ctx.moveTo(x-6,BENCH-44);ctx.quadraticCurveTo(x,BENCH-44-22*fl,x+6,BENCH-44);ctx.fill();
 ctx.fillStyle='rgba(255,190,90,.6)';ctx.beginPath();ctx.moveTo(x-3,BENCH-44);ctx.quadraticCurveTo(x,BENCH-44-12*fl,x+3,BENCH-44);ctx.fill();
 // balão de fundo redondo
 const cy=BENCH-92,r=26,f=()=>{ctx.beginPath();ctx.moveTo(x-7,BENCH-170);ctx.lineTo(x-7,cy-r+3);ctx.arc(x,cy,r,-Math.PI/2-.28,Math.PI*1.5+.28,true);ctx.lineTo(x+7,BENCH-170)};
 liquid(f,BENCH-100,BENCH,'#ff6b8b');glass(f);
}
function drawTubes(x){ctx.fillStyle='#8a6a4a';ctx.fillRect(x-6,BENCH-50,96,7);ctx.fillRect(x-6,BENCH-14,96,7);ctx.fillRect(x-6,BENCH-50,5,50);ctx.fillRect(x+85,BENCH-50,5,50);
 ['#ff9f43','#4fd1c5','#ff6b8b','#7aa2ff'].forEach((c,i)=>{const tx=x+10+i*20,f=()=>{ctx.beginPath();ctx.moveTo(tx-6,BENCH-82);ctx.lineTo(tx-6,BENCH-14);ctx.arc(tx,BENCH-14,6,Math.PI,0,true);ctx.lineTo(tx+6,BENCH-82)};
  liquid(f,BENCH-40-i*6,BENCH,c);glass(f)});ctx.fillStyle='#8a6a4a';ctx.fillRect(x-6,BENCH-50,96,7)}
function micropipette(x,tipY,color,rot=0){ctx.save();ctx.translate(x,tipY);ctx.rotate(rot);
 ctx.fillStyle='rgba(235,245,255,.85)';ctx.beginPath();ctx.moveTo(-1.5,0);ctx.lineTo(-5,-34);ctx.lineTo(5,-34);ctx.lineTo(1.5,0);ctx.fill();
 ctx.fillStyle='#dfe5ea';rr(-6,-50,12,18,3);ctx.fill();
 ctx.fillStyle='#eef2f5';rr(-9,-112,18,64,7);ctx.fill();ctx.fillStyle=color;rr(-9,-96,18,10,2);ctx.fill();
 ctx.fillStyle='#c9d1d8';rr(-12,-100,8,24,3);ctx.fill();
 ctx.fillStyle='#d6dce1';ctx.fillRect(-3,-126,6,16);ctx.fillStyle=color;rr(-8,-134,16,9,4);ctx.fill();ctx.restore()}
function drawPipetteStand(x){ctx.fillStyle='#3d4a57';rr(x-40,BENCH-10,80,10,3);ctx.fill();ctx.fillRect(x-3,BENCH-190,6,180);
 ctx.fillRect(x-36,BENCH-180,72,6);['#ff6b8b','#ffd166','#4fd1c5'].forEach((c,i)=>micropipette(x-24+i*24,BENCH-40,c))}
function drawDrip(){const x=735,tipY=BENCH-112,surf=BENCH-44,ph=(t%1.8)/1.8;
 micropipette(x,tipY,'#7aa2ff');
 ctx.fillStyle='rgba(122,162,255,.9)';
 if(ph<.6){circle(x,tipY+2+ph*5,1+ph*4);ctx.fill()}
 else if(ph<.78){const k=(ph-.6)/.18,y=tipY+5+k*k*(surf-tipY-5);ell(x,y,3,4.5);ctx.fill()}
 else{const k=(ph-.78)/.22;ctx.strokeStyle=`rgba(200,220,255,${1-k})`;ctx.lineWidth=1.5;ell(x,surf,4+k*16,1.5+k*3);ctx.stroke()}}
const SHELF=[['#6b3f1f','NaCl'],['#2f6fb6','PBS'],['#6b3f1f','EtOH'],['#2fb37a','HCl'],['#8a2f4f','KCl'],['#6b3f1f','DMSO']];
function drawLab(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b4459');g.addColorStop(1,'#1c2e40');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;
 for(let y=0;y<BENCH;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,BENCH);ctx.stroke()}
 // prateleira
 ctx.fillStyle='#4a5a6a';ctx.fillRect(0,232,W,8);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,240,W,6);
 SHELF.forEach(([c,l],i)=>{for(const side of[0,1]){const x=side?W-40-i*52:40+i*52;
  ctx.fillStyle=hexA(c,.9);rr(x-15,192,30,40,5);ctx.fill();ctx.fillStyle='#22272c';ctx.fillRect(x-8,182,16,10);
  ctx.fillStyle='#f4efe2';ctx.fillRect(x-12,204,24,16);txt(l,x,216,8,'#333','center','bold')}});
 // bancada
 ctx.fillStyle='#3a4754';ctx.fillRect(0,BENCH,W,H-BENCH);ctx.fillStyle='#6f808f';ctx.fillRect(0,BENCH-2,W,9);
 ctx.fillStyle='rgba(0,0,0,.18)';for(let x=60;x<W;x+=240)ctx.fillRect(x,BENCH+30,4,H);
 // vidraria
 drawErlen(70,84,110,'#4fd1c5',.42);
 drawBoiling(180);
 drawTubes(245);
 drawPipetteStand(380);
 drawBeaker(735,72,82,'#7aa2ff',.54);
 drawCylinder(805,26,142,'#ffd166',.6);
 drawErlen(878,74,100,'#9b7bff',.42);
 drawDrip();
 // bolhas
 for(const b of bubbles){const c=b.e.color;
  if(!b.out){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;circle(b.x,b.y,b.r);ctx.stroke()}
  else{const a=clamp(b.life/1.2);ctx.fillStyle=hexA(c,.18*a);circle(b.x,b.y,b.r);ctx.fill();ctx.strokeStyle=hexA(c,.8*a);ctx.lineWidth=1.5;ctx.stroke();
   ctx.fillStyle=`rgba(255,255,255,${.8*a})`;circle(b.x-b.r*.35,b.y-b.r*.35,b.r*.25);ctx.fill()}}
 for(const p of pops){ctx.strokeStyle=hexA(p.c,1-p.k);ctx.lineWidth=1.2;for(let i=0;i<6;i++){const a=i*TAU/6,r1=p.r*(.6+p.k),r2=p.r*(1+p.k*1.4);
  ctx.beginPath();ctx.moveTo(p.x+Math.cos(a)*r1,p.y+Math.sin(a)*r1);ctx.lineTo(p.x+Math.cos(a)*r2,p.y+Math.sin(a)*r2);ctx.stroke()}}
}
function panel(x,y,w,h,a=.82){rr(x,y,w,h,14);ctx.fillStyle=`rgba(13,22,31,${a})`;ctx.fill()}

// ---------- estado ----------
let state='title',buttons=[],mouse={x:330,y:300},keys={},touchMode=false,holdId=null;
let lvl=0,score=0,attempts=[],nameIdx=0,mouseName='',tgt=null;
let hand={x:330},tremA=.03,lagK=9,vDesc=1,timeLimit=24,tol=.3,aimT=0,ph=[0,0,0,0];
let apFix=null,dvNow=.3,dvFix=0,injT=0,res=null,rt=0,particles=[],timedOut=false,sceneT=0;
const NAMES=['Pipoca','Paçoca','Fubá','Tapioca','Cocada','Quindim','Jujuba','Bolinha','Canjica','Pamonha','Brigadeiro','Biscoito'];

// ---------- atlas (corte sagital, mm a partir do bregma) ----------
const S=60,PAN={x:20,y:20,w:620,h:600};
const X=ap=>30+(-1-ap)*S,Y=dv=>230-dv*S;
const apAt=x=>-1-(x-30)/S,dvAt=y=>(230-y)/S;
const TARGETS=[
 {s:'NTS',n:'Núcleo do trato solitário',ap:-7.5,ml:.3,dv:-4.7,rx:.42,ry:.2,c:'#ffd166',lx:0,ly:-20,
  info:'Recebe sinais dos pulmões e dos quimiorreceptores do corpo carotídeo (pelos nervos vago e glossofaríngeo) e ajusta os reflexos da respiração.'},
 {s:'preBötC',n:'Complexo pré-Bötzinger',ap:-6.8,ml:1.25,dv:-5.4,rx:.23,ry:.2,c:'#ff6b8b',lx:-4,ly:-18,
  info:'É o "marca-passo" da respiração: seus neurônios geram o ritmo de cada inspiração, sem que a gente precise pensar nisso.'},
 {s:'RTN',n:'Núcleo retrotrapezoide',ap:-5.9,ml:1.3,dv:-5.7,rx:.38,ry:.12,c:'#4fd1c5',lx:-40,ly:24,
  info:'É um sensor de CO₂: quando o gás carbônico no sangue aumenta, o RTN manda o corpo respirar mais forte e mais rápido.'},
 {s:'LC',n:'Locus coeruleus',ap:-5.4,ml:.9,dv:-3.6,rx:.2,ry:.3,c:'#7aa2ff',lx:-30,ly:6,
  info:'Produz noradrenalina, controla o estado de alerta e também responde ao CO₂. É uma das regiões afetadas cedo na doença de Parkinson.'},
 {s:'rVRG',n:'Grupo respiratório ventral rostral',ap:-7.3,ml:1.4,dv:-5.3,rx:.3,ry:.18,c:'#9b7bff',lx:26,ly:4,
  info:'Neurônios pré-motores que levam o comando da inspiração até os motoneurônios do nervo frênico, que fazem o diafragma contrair.'}];
const LANDMARKS=[
 {n:'7N',full:'o núcleo do nervo facial (7N)',ap:-6.15,dv:-5.2,rx:.38,ry:.25},
 {n:'oliva inf.',full:'a oliva inferior',ap:-7.15,dv:-5.83,rx:.45,ry:.12},
 {n:'Pn',full:'os núcleos pontinos',ap:-4.35,dv:-5.85,rx:.45,ry:.22}];
const BRAIN=[[-0.3,-.5],[-1.5,-.55],[-3,-.65],[-3.8,-.85],[-4.3,-1.25],[-4.7,-1.2],[-5.1,-1.45],[-5.35,-1.75],[-5.6,-1.55],[-6.3,-1.45],[-7,-1.7],[-7.6,-2.3],[-8,-3.1],[-8.15,-3.9],[-8.4,-4.15],[-9,-4.35],[-11.8,-4.5],
 [-11.8,-5.45],[-9,-5.55],[-8.2,-5.8],[-7.4,-6],[-6.6,-6.05],[-5.9,-6.05],[-5.3,-6],[-4.9,-6.15],[-4.2,-6.2],[-3.6,-5.95],[-3.1,-5.8],[-2,-5.75],[-0.3,-5.7]];
const CEREB=[[-5.35,-1.75],[-5.6,-1.55],[-6.3,-1.45],[-7,-1.7],[-7.6,-2.3],[-8,-3.1],[-8.15,-3.9],[-7.95,-4.08],[-7.3,-3.82],[-6.5,-3.37],[-5.6,-2.95],[-5.4,-2.5]];
const VENT=[[-5.45,-2.95],[-6.5,-3.4],[-7.3,-3.85],[-7.95,-4.1],[-7.95,-4.2],[-7.3,-4.1],[-6.5,-3.75],[-5.45,-3.15]];

function smoothPath(pts,closed=true){
 const p=pts.map(([a,d])=>[X(a),Y(d)]),P=new Path2D(),n=p.length;
 if(closed){const m=(i,j)=>[(p[i][0]+p[j][0])/2,(p[i][1]+p[j][1])/2];let s=m(n-1,0);P.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const e=m(i,(i+1)%n);P.quadraticCurveTo(p[i][0],p[i][1],e[0],e[1])}P.closePath()}
 else{P.moveTo(p[0][0],p[0][1]);for(let i=1;i<n-1;i++){const e=[(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2];P.quadraticCurveTo(p[i][0],p[i][1],e[0],e[1])}P.lineTo(p[n-1][0],p[n-1][1])}
 return P}

function f2(n){return n.toFixed(2).replace('.',',')}

 for(const o of LANDMARKS)if(inEll(ap,dv,o))return o.full;

 if(ctx.isPointInPath(PATH.vent,x,y))return'o 4º ventrículo (cheio de líquor)';

function tipPos(){
 if(state==='ap'){const d=tremor();return{x:clamp(hand.x+d.x,32,628),y:Y(.3)+d.y*.4}}

// ---------- fluxo ----------
function newGame(){lvl=0;score=0;attempts=[0,0,0,0,0];nameIdx=Math.floor(Math.random()*NAMES.length);startLevel()}
function startLevel(){
 tgt=TARGETS[lvl];attempts[lvl]++;mouseName=NAMES[nameIdx++%NAMES.length];
 tremA=[.03,.045,.06,.075,.09][lvl];lagK=[9,8,7,6.5,6][lvl];vDesc=[1,1.15,1.3,1.45,1.6][lvl];
 timeLimit=[24,22,20,18,17][lvl];tol=[.3,.28,.26,.24,.22][lvl];
 ph=ph.map(()=>rnd(0,TAU));hand.x=mouse.x;aimT=0;apFix=null;dvNow=.3;timedOut=false;sceneT=0;state='ap';
}
function fixAP(){if(state!=='ap')return;apFix=apAt(tipPos().x);state='dv';snd(140,.25,'sawtooth',.05,-40);snd(880,.08,'sine',.06,0,.05)}
function inject(){if(state==='ap')fixAP();if(state!=='dv')return;dvFix=dvNow;injT=0;state='inject';holdId=null;keys.desc=false;snd(220,.6,'triangle',.07,160)}
function evaluate(){
 const dAP=apFix-tgt.ap,dDV=dvFix-tgt.dv,d=Math.hypot(dAP,dDV),ok=!timedOut&&d<=tol;
 res={ok,dAP,dDV,d,pts:0,theta:0,turns:0,where:ok?'':whereIs(apFix,dvFix),name:mouseName};
 rt=0;particles=[];
 if(ok){res.pts=100+Math.round(100*(1-d/tol))+Math.round(50*clamp(1-aimT/timeLimit))-40*(attempts[lvl]-1);res.pts=Math.max(50,res.pts);score+=res.pts;state='hit';
  [523,659,784,1046].forEach((f,i)=>snd(f,.18,'triangle',.12,0,i*.1))}
 else{state='miss';snd(180,.4,'sawtooth',.07,-60)}
}
function next(){lvl++;if(lvl>=TARGETS.length)startFinale();else startLevel()}

// ---------- update ----------
function update(dt){
 updateLab(dt);sceneT+=dt;
 if(state==='ap'||state==='dv'){
  aimT+=dt;
  if(state==='ap'){const k=1-Math.exp(-dt*lagK);hand.x+=(mouse.x-hand.x)*k}
  else if(keys.desc||holdId!==null){const before=dvNow;dvNow=Math.max(-6.8,dvNow-vDesc*dt);
   if(Math.floor(before*10)!==Math.floor(dvNow*10))snd(1200,.025,'square',.015)}
  if(aimT>=timeLimit){timedOut=true;if(state==='ap')fixAP();inject()}
 }else if(state==='inject'){injT+=dt;if(injT>=1.3)evaluate()}
 else if(state==='miss'){rt+=dt;
  if(rt>.6){const sp=clamp((rt-.6)/1)*(TAU/1.1);res.theta+=sp*dt;const n=Math.floor(res.theta/TAU);if(n>res.turns){res.turns=n;snd(1300,.08,'square',.035,400)}}}
 else if(state==='hit'){rt+=dt;
  if(rt>.3&&!res.burst){res.burst=true;for(let i=0;i<40;i++)particles.push({x:300,y:330,vx:rnd(-260,260),vy:rnd(-380,-80),life:rnd(1.2,2.2),c:['#ff6b8b','#ffd166','#4fd1c5','#7aa2ff','#9b7bff'][i%5],h:i%3===0})}}
 else if(state==='finale')updateFinale(dt);
 else if(UPD[state])UPD[state](dt);
 for(const p of particles){if(!p.spark)p.vy+=420*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
}
